<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EHS Audit Form</title>
<style>

:root{
--sap-blue:#0a6ed1;
--sap-dark:#082b4c;
--sap-green:#107e3e;
}

*{
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}

body{
margin:0;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:
radial-gradient(circle at top,#0a6ed1 0%,transparent 35%),
linear-gradient(135deg,#061c32,#0b3954);
}

.contenedor{
width:95%;
max-width:1000px;
height:calc(100vh - 40px);
background:rgba(255,255,255,.97);
border-radius:25px;
padding:25px;
box-shadow:
0 20px 50px rgba(0,0,0,.35);
display:flex;
flex-direction:column;
}

.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:18px;
}

.logo{
width:55px;
height:55px;
background:
linear-gradient(
135deg,
#0a6ed1,
#00a6ff
);

border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:26px;
font-weight:bold;
box-shadow:
0 8px 20px rgba(10,110,209,.4);
}

h1{
margin:0;
font-size:24px;
color:var(--sap-dark);
}

.subtitulo{
font-size:13px;
color:#667;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

input,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccd6e0;
font-size:14px;
background:white;
transition:.3s;
}

input:focus,
textarea:focus{
outline:none;
border-color:var(--sap-blue);
box-shadow:
0 0 0 3px rgba(10,110,209,.15);
}

textarea{
height:80px;
margin-top:12px;
resize:none;
}

.file-box{
margin-top:12px;
padding:12px;
border-radius:15px;
background:#eef6ff;
border:2px dashed var(--sap-blue);
}

.file-box label{
font-weight:bold;
color:var(--sap-dark);
}

button{
margin-top:15px;
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:
linear-gradient(
135deg,
#0a6ed1,
#00a6ff
);

color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:
0 15px 30px rgba(10,110,209,.4);
}

#resultado{
margin-top:12px;
padding:10px;
border-radius:10px;
text-align:center;
font-weight:bold;
background:#f1f5f9;
}

.footer{
margin-top:auto;
text-align:center;
font-size:12px;
color:#777;
}

@media(max-width:700px){
body{
overflow:auto;
height:auto;
}

.contenedor{
height:auto;
min-height:100vh;
}

.form-grid{
grid-template-columns:1fr;
}
}

input[readonly]{
    background:#e9eef5;
    color:#555;
    cursor:not-allowed;
    border-color:#b8c4d1;
}

.home-btn{
position:fixed;
top:20px;
left:20px;
width:60px;
height:60px;
border-radius:18px;
background:linear-gradient(135deg,#0a6ed1,#00a6ff);
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
box-shadow:
0 10px 25px rgba(0,0,0,.35),
0 0 15px rgba(0,166,255,.35);
transition:.3s;
z-index:9999;
}

.home-btn svg{
width:32px;
height:32px;
fill:white;
transition:.3s;
}

.home-btn:hover{
transform:translateY(-4px) scale(1.08);
box-shadow:
0 18px 35px rgba(10,110,209,.45),
0 0 25px rgba(0,166,255,.6);
}

.home-btn:hover svg{
transform:scale(1.15);
}

.home-btn::after{
content:"HOME";
position:absolute;
left:72px;
background:rgba(8,43,76,.95);
color:white;
padding:7px 12px;
border-radius:10px;
font-size:13px;
font-weight:600;
opacity:0;
transform:translateX(-10px);
transition:.3s;
white-space:nowrap;
pointer-events:none;
}

.home-btn:hover::after{
opacity:1;
transform:translateX(0);
}


</style>
</head>
<a href="HallazgosEHSEditar.html" class="home-btn" title="Inicio">
🏠
</a>
<body>

<div class="contenedor">
<div class="header">
<div class="logo">
E
</div>
<div>

<h1>EHS Audit Management</h1>
<div class="subtitulo">
Environmental Health & Safety Platform
</div>
</div>
</div>

<div class="form-grid">
<input id="folio" placeholder="📌 Folio Auditoría">
<input id="plant" value="Plant1" placeholder="🏭 Plant" readonly>
<input id="shift" placeholder="⏱ Shift">
<input id="area" value="Rough Cut" placeholder="📍 Area" readonly>
<input id="ehs" placeholder="👷 EHS Responsible">
<input id="gerente" value="Ernesto Guerrero" placeholder="👔 Manager" readonly>
<input id="fecha" type="date">
<input id="status" value="In Process" placeholder="📊 Status" readonly>
<input id="co" value="Open" placeholder="⚠ C/O" readonly>
</div>


<textarea 
id="descripcion"
placeholder="📝 Audit Description">
</textarea>

<div class="file-box">
<label>📄 Upload Audit PDF</label>


<input 
type="file" 
id="pdf"
accept=".pdf">
</div>

<button onclick="guardar()">🚀 Save Audit Record</button>

<div id="resultado">
Ready...
</div>

<div class="footer">
Disign LAOM System 
</div>
</div>

<script type="module">

import { createClient } from 
"https://esm.sh/@supabase/supabase-js";

const supabaseUrl =
"https://mrxtqmvufmlozplszfxc.supabase.co";

const supabaseKey =
"sb_publishable_jlCWFKk3xQnfvcjH1PfywQ_cJqILkk-";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

window.guardar = async()=>{

document.getElementById("resultado").innerHTML =
"⏳ Guardando información...";

let pdfURL="";

const archivo =
document.getElementById("pdf").files[0];

if(archivo){
const folio =
document.getElementById("folio").value;
const extension =
archivo.name.split(".").pop();
const nombreArchivo =
folio+"_"+Date.now()+"."+extension;
const {error:uploadError}=
await supabase.storage
.from("pdfs")
.upload(nombreArchivo,archivo);

if(uploadError){
document.getElementById("resultado").innerHTML =
"❌ Error PDF: "+uploadError.message;
return;
}


const {data:urlData}=
supabase.storage
.from("pdfs")
.getPublicUrl(nombreArchivo);
pdfURL =
urlData.publicUrl;
}

const {error}=
await supabase
.from("Auditorias_Gestion_EHS")
.insert([{
Folio:
document.getElementById("folio").value,
Plant:
document.getElementById("plant").value,
Shift:
document.getElementById("shift").value,
Area:
document.getElementById("area").value,
EHSName:
document.getElementById("ehs").value,
Gerente:
document.getElementById("gerente").value,
Fecha:
document.getElementById("fecha").value,
Status:
document.getElementById("status").value,
"C/O":
document.getElementById("co").value,
Description:
document.getElementById("descripcion").value,
PDF:
pdfURL
}]);

if(error){
document.getElementById("resultado").innerHTML =
"❌ Error: "+error.message;
}
else{
document.getElementById("resultado").innerHTML =
"✅ Auditoría guardada correctamente";

limpiarFormulario();
}
};

function limpiarFormulario(){
setTimeout(()=>{
document.getElementById("folio").value="";
document.getElementById("plant").value="Plant1";
document.getElementById("shift").value="";
document.getElementById("area").value="Rough Cut";
document.getElementById("ehs").value="";
document.getElementById("gerente").value="Ernesto Guerrero";
document.getElementById("fecha").value="";
document.getElementById("status").value="In Process";
document.getElementById("co").value="Open";
document.getElementById("descripcion").value="";

document.getElementById("pdf").value="";
document.getElementById("resultado").innerHTML =

"🟢 Ready for new audit...";
},2000);
}

</script>
</body>
</html>
