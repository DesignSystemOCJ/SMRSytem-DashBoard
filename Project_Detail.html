<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js_project_detail.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{
min-height:100vh;
padding:20px;
background:
linear-gradient(
135deg,
#071B34,
#0A6ED1
);
color:white;
}


.container{
max-width:1400px;
margin:auto;
}


.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}



.header h1{
font-size:28px;
font-weight:600;
display:flex;
gap:10px;
align-items:center;
}



.home-btn{
width:45px;
height:45px;
border-radius:50%;
border:none;
background:#00c8ff;
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 5px 15px #0005;
transition:.3s;
}


.home-btn:hover{
transform:scale(1.1);
background:#00e5ff;
}


.card{
background:
rgba(255,255,255,.12);
border:
1px solid rgba(255,255,255,.25);
backdrop-filter:blur(15px);
border-radius:18px;
padding:20px;
margin-bottom:18px;
box-shadow:
0 10px 25px rgba(0,0,0,.20);
}


.section-title{
font-size:18px;
font-weight:600;
display:flex;
align-items:center;
gap:8px;
margin-bottom:15px;
}


.grid-2{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}


.grid-4{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr;
gap:15px;
}


.main-layout{
display:grid;
grid-template-columns:3fr 1.2fr;
gap:18px;
}


.field{
display:flex;
flex-direction:column;
}


label{
font-size:13px;
margin-bottom:5px;
color:#e7f7ff;
}


input,
textarea,
select{
width:100%;
padding:10px;
border:none;
border-radius:10px;
outline:none;
background:
rgba(255,255,255,.18);
color:white;
font-size:14px;
}


input:focus,
textarea:focus{
background:
rgba(255,255,255,.25);
}


textarea{
resize:none;
height:170px;
}



input[readonly],
textarea[readonly]{
cursor:default;
}


.responsibility{
display:flex;
flex-direction:column;
gap:15px;
}


.evidence-layout{
display:grid;
grid-template-columns:1fr 180px 1fr;
gap:25px;
align-items:center;
}


.image-box{
display:flex;
flex-direction:column;
gap:10px;
}



.image-box img{
width:100%;
height:260px;
object-fit:cover;
border-radius:14px;
background:#ffffff22;
border:
1px solid #ffffff40;
}


.progress-box{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:12px;
}


.progress-box input{
width:120px;
height:80px;
font-size:25px;
text-align:center;
font-weight:bold;
}



.buttons{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
}



.buttons{
display:flex;
justify-content:center;
gap:20px;
padding-top:10px;
}


button{
position:relative;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
min-width:140px;
height:48px;
border:none;
border-radius:14px;
font-size:15px;
font-weight:600;
color:white;
cursor:pointer;
overflow:hidden;
transition:.35s;
box-shadow:
0 8px 20px rgba(0,0,0,.25);
}


button::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.35),
transparent
);
transition:.5s;
}


button:hover::before{
left:100%;
}


button:hover{
transform:
translateY(-5px)
scale(1.03);
box-shadow:
0 15px 30px rgba(0,0,0,.35);
}


button:active{
transform:
scale(.96);
}


button:hover{
transform:translateY(-3px);
}



#btnEdit{
background:
linear-gradient(
135deg,
#00c6ff,
#0072ff
);
}


#btnSave{
background:
linear-gradient(
135deg,
#00e676,
#00a651
);
}


.delete{
background:
linear-gradient(
135deg,
#ff5252,
#c62828
);
}


.close-btn{
background:
linear-gradient(
135deg,
#757575,
#212121
);
}


button:disabled{
opacity:.5;
cursor:not-allowed;
transform:none;
}



@media(max-width:1000px){
.main-layout{
grid-template-columns:1fr;
}

.evidence-layout{
grid-template-columns:1fr;
}


.grid-4{
grid-template-columns:repeat(2,1fr);
}
}


@media(max-width:600px){
.grid-2,
.grid-4{
grid-template-columns:1fr;
}
}


</style>
</head>
<body>

<div class="container">
<div class="header">
<h1><i class="fa-solid fa-folder-open"></i>Project Detail</h1>

<button 
class="home-btn"
onclick="window.location.href='Projects.html'"
title="Go Home">
<i class="fa-solid fa-house"></i>
</button>
</div>



<div class="card">
<div class="grid-2">
<div class="field">

<label>Project ID</label>

<input 
id="ProjectID"
readonly>
</div>

<div class="field">
<label>Folio</label>

<input 
id="Folio"
readonly>
</div>
</div>
<br>

<div class="grid-2">
<div class="field">
<label>Date Start</label>
<input 
id="DateStart"
readonly>
</div>


<div class="field">
<label>Date End</label>
<input 
id="DateEnd"
readonly>
</div>
</div>
<br>


<div class="grid-4">
<div class="field">
<label>Project Name</label>
<input 
id="ProjectName"
readonly>
</div>


<div class="field">
<label>Type</label>
<input 
id="Type"
readonly>
</div>


<div class="field">
<label>Priority</label>
<input 
id="Priority"
readonly>
</div>


<div class="field">
<label>Status</label>
<input 
id="Status"
readonly>
</div>
</div>
</div>


<div class="main-layout">
<div>
<div class="card">
<div class="section-title">
<i class="fa-solid fa-triangle-exclamation"></i>
Problem Description
</div>

<textarea
id="ProblemDescription"
readonly></textarea>
</div>
</div>


<div>
<div class="card">
<div class="section-title">
<i class="fa-solid fa-users"></i>
Responsibility
</div>

<div class="responsibility">
<div class="field">
<label>Lead</label>
<input
id="Lead"
readonly>
</div>

<div class="field">
<label>Manager</label>
<input
id="Manager"
readonly>
</div>


<div class="field">
<label>Department</label>
<input
id="Department"
readonly>
</div>
</div>
</div>
</div>
</div>

<div class="card">
<div class="evidence-layout">
<div class="image-box">
<label>Evidence Before</label>

<img
id="Evidencebefore"
src=""
alt="Evidence Before">

<input
type="file"
id="EvidenceBeforeFile"
accept="image/*"
disabled
onchange="previewImage(this,'Evidencebefore')">
</div>


<!-- PROGRESS -->
<div class="progress-box">
<label>Progress %</label>
<input
id="Progress"
readonly>

<i class="fa-solid fa-arrow-right-long"
style="
font-size:35px;
color:#8EE9FF;
">
</i>
</div>


<div class="image-box">
<label>Evidence After</label>
<img
id="EvidenceAfter"
src=""
alt="Evidence After">


<input
type="file"
id="EvidenceAfterFile"
accept="image/*"
disabled
onchange="previewImage(this,'EvidenceAfter')">
</div>
</div>
</div>


<div class="card">
<div class="section-title">
<i class="fa-solid fa-comments"></i>
Comments
</div>


<textarea
id="RemarksComments"
readonly></textarea>
</div>


<div class="card">
<div class="buttons">
<button
id="btnEdit"
onclick="activarEdicion()">
<i class="fa-solid fa-pen"></i>
Edit
</button>


<button
id="btnSave"
onclick="guardarProyecto()"
disabled>
<i class="fa-solid fa-floppy-disk"></i>
Save
</button>


<button
class="delete"
onclick="eliminarProyecto()">
<i class="fa-solid fa-trash"></i>
Delete
</button>


<button
class="close-btn"
onclick="window.close()">
<i class="fa-solid fa-xmark"></i>
Close
</button>
</div>
</div>
</div>
</body>
</html>
