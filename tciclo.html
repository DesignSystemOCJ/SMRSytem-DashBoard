<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuedasPro - Producción en Tiempo Real</title>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Hoja de Estilos Personalizados -->
    <link rel="stylesheet" href="tciclo.css">

    <!-- Configuración inicial de Tailwind y Supabase -->
    <script>
        const supabaseUrl = "https://mrxtqmvufmlozplszfxc.supabase.co";
        const supabaseKey = "sb_publishable_jlCWFKk3xQnfvcjH1PfywQ_cJqILkk-";
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        },
                        appBg: '#f1f5f9',
                        cardBg: '#ffffff'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar overflow-x-hidden">

    <!-- MAIN BODY CONTAINER -->
    <div class="flex flex-grow max-w-[1700px] w-full mx-auto p-4 lg:p-6 gap-6">

        <!-- MAIN CONTENT AREA -->
        <main class="flex-grow space-y-6 min-w-0">

            <!-- SECTION 1: NAVE BANNER UNIFICADO PREMIUM -->
            <div class="w-full max-w-5xl mx-auto bg-white rounded-3xl p-6 shadow-sm border border-slate-200/80 relative overflow-hidden">
                <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl pointer-events-none"></div>

                <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6 md:gap-8">
                    
                    <div class="flex flex-col items-start min-w-[140px] -mt-2">
                        <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Promedio Actual</span>
                        <div class="flex items-baseline gap-1 mt-0.5">
                            <span id="promedio-time-val" class="text-3xl font-black text-slate-900 tracking-tight font-mono">24</span>
                            <span class="text-[11px] text-slate-400 font-mono">ruedas/h</span>
                        </div>
                        <div id="target-vs-actual-container" class="text-[11px] font-semibold text-emerald-600 mt-1.5 flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-50 border border-emerald-200/60">
                            <i id="target-vs-actual-icon" class="fa-solid fa-arrow-up text-[9px]"></i> 
                            <span id="target-vs-actual-val">+0.0%</span> 
                            <span class="text-slate-400 font-normal">Target vs. Actual</span>
                        </div>
                    </div>

                    <div class="flex flex-col items-center justify-center flex-1">
                        <span class="text-xs font-mono font-bold text-slate-400 tracking-wider uppercase mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-layer-group text-blue-500"></i>Production: <strong id="production-val" class="text-slate-800 text-sm">8,960</strong>
                        </span>
                        
                        <div class="w-32 h-32 relative flex items-center justify-center my-1">
                            <canvas id="gaugeChart"></canvas>
                            <div class="absolute text-center flex flex-col items-center">
                                <span id="gauge-time-val" class="text-xl font-black text-slate-900 font-mono leading-none">112</span>
                                <span class="text-[10px] font-bold text-slate-400 font-mono mt-0.5">WPH</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col items-start md:items-end min-w-[160px]">
                        <div class="flex items-center gap-2">
                            <span id="active-models-count" class="text-3xl font-black text-slate-900 font-mono">0</span>
                            <span class="text-xs font-semibold text-slate-500 leading-tight">modelos<br/>activos</span>
                        </div>
                        <div class="mt-3 flex items-center gap-2">
                            <span class="w-3.5 h-3.5 rounded-full ring-2 ring-white shadow-sm" style="background-color: #0284c7;"></span>
                            <span class="w-3.5 h-3.5 rounded-full ring-2 ring-white shadow-sm" style="background-color: #10b981;"></span>
                            <span class="w-3.5 h-3.5 rounded-full ring-2 ring-white shadow-sm" style="background-color: #8b5cf6;"></span>
                            <span class="w-3.5 h-3.5 rounded-full ring-2 ring-white shadow-sm" style="background-color: #f59e0b;"></span>
                            <span class="w-3.5 h-3.5 rounded-full ring-2 ring-white shadow-sm" style="background-color: #ec4899;"></span>
                            <span class="w-3.5 h-3.5 rounded-full ring-2 ring-white shadow-sm" style="background-color: #ef4444;"></span>
                        </div>
                    </div>

                </div>

                <div class="mt-6 pt-5 border-t border-slate-100 flex flex-col sm:flex-row items-center gap-4">
                    <div class="flex-shrink-0">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-semibold border border-emerald-200 shadow-sm">
                            <i class="fa-solid fa-check text-[11px]"></i> En objetivo
                        </span>
                    </div>

                    <div class="w-full relative flex items-center">
                        <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden p-0.5 border border-slate-200/80">
                            <div class="bg-gradient-to-r from-blue-600 via-cyan-500 to-emerald-500 h-full rounded-full transition-all duration-500" style="width: 89.6%;"></div>
                        </div>

                        <div class="absolute -top-7 right-[10.4%] flex flex-col items-center transform translate-x-1/2">
                            <div class="bg-purple-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md shadow-md flex items-center justify-center font-mono">
                                01
                            </div>
                            <div class="w-0.5 h-2.5 bg-purple-600"></div>
                        </div>
                    </div>

                    <div class="flex-shrink-0 font-mono text-sm font-extrabold text-slate-800">
                        89.6%
                    </div>
                </div>
            </div>

            <!-- SECTION 2: MIDDLE ROW -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                <!-- LEFT: TABLA TBLPROD -->
                <div class="lg:col-span-3 bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4 flex flex-col justify-between">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <div class="flex flex-col">
                            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-clock text-blue-600"></i>
                                Producción Actual
                            </h3>
                            <span id="fecha-actual-prod" class="text-[11px] font-mono font-medium text-slate-500 pl-6"></span>
                        </div>
                    </div>

                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-center border-collapse">
                            <thead>
                                <tr class="text-[10px] font-mono text-slate-500 uppercase border-b border-slate-100">
                                    <th class="py-2 px-0.5 font-semibold text-center">Cell</th>
                                    <th class="py-2 px-0.5 font-semibold text-center">Model</th>
                                    <th class="py-2 px-0.5 font-semibold text-center">Time</th>
                                    <th class="py-2 px-0.5 font-semibold text-center">Actual</th>
                                    <th class="py-2 px-0.5 font-semibold text-center">Diff</th>
                                </tr>
                            </thead>
                            <tbody id="tblprod-tbody" class="text-xs font-mono divide-y divide-slate-100">
                                <tr>
                                    <td colspan="5" class="py-4 text-center text-slate-400">Cargando datos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- RIGHT: CONTENEDOR MATRIZ DE MODELOS -->
                <div id="container-matriz-modelos" class="lg:col-span-9 bg-white rounded-2xl p-3 md:p-4 shadow-sm border border-slate-200 space-y-3 flex flex-col justify-start overflow-hidden">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-table-cells text-blue-600"></i>
                            Matriz de Modelos
                        </h3>
                        <div class="flex items-center gap-2">
                            <select id="matrix-view-select" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-3 py-1.5 rounded-lg transition-colors shadow-sm focus:outline-none cursor-pointer">
                                <option value="model-cells" class="bg-white text-slate-800">Model&Cells</option>
                                <option value="historial-modelos" class="bg-white text-slate-800">Historial de Modelos</option>
                            </select>
                            <select id="matrix-model-filter" class="bg-slate-100 border border-slate-200 text-xs font-mono text-slate-700 rounded-lg px-2.5 py-1 focus:outline-none">
                                <option value="">Todos los modelos</option>
                            </select>
                            <button id="matrix-clear-filter-btn" title="Limpiar filtro" class="bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-600 hover:text-slate-900 px-2 py-1 rounded-lg text-xs transition-colors flex items-center justify-center">
                                <i class="fa-solid fa-broom"></i>
                            </button>
                        </div>
                    </div>

                    <div class="w-full overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-separate border-spacing-0.5 table-fixed">
                            <thead>
                                <tr id="matrix-thead-tr" class="text-[10px] font-mono text-slate-500 uppercase">
                                    <th class="py-1 px-1 font-semibold sticky left-0 bg-white z-20 w-[95px]">Modelo</th>
                                    <th class="py-1 px-1 font-semibold sticky left-[95px] bg-white z-20 w-[55px]">SIZE</th>
                                    <th class="py-1 px-1 font-semibold sticky left-[150px] bg-white z-20 w-[45px]">WPH</th>
                                </tr>
                            </thead>
                            <tbody id="matrix-tbody" class="text-[11px] font-mono">
                                <tr>
                                    <td class="py-4 text-center text-slate-400">Cargando matriz...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- RIGHT: CONTENEDOR HISTORIAL DE MODELOS (DATE) - OCULTO INICIALMENTE -->
                <div id="container-historial-modelos" class="hidden lg:col-span-9 bg-white rounded-2xl p-3 md:p-4 shadow-sm border border-slate-200 space-y-3 flex flex-col justify-start overflow-hidden">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                        <div class="flex items-center gap-3">
                            <button id="back-to-matrix-btn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs px-2.5 py-1 rounded-lg transition-colors flex items-center gap-1">
                                <i class="fa-solid fa-arrow-left"></i> Volver
                            </button>
                            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-clock-rotate-left text-blue-600"></i>
                                Historial de Modelos (Date)
                            </h3>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <span id="history-date-range-label" class="text-xs font-mono text-slate-500 font-medium"></span>
                            <button id="history-prev-days-btn" title="Días anteriores" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-bold transition-colors">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                            <button id="history-next-days-btn" title="Días posteriores" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-bold transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <div class="w-full overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-separate border-spacing-0.5 table-fixed">
                            <thead>
                                <tr id="history-thead-tr" class="text-[10px] font-mono text-slate-500 uppercase">
                                    <th class="py-1.5 px-2 font-semibold sticky left-0 bg-white z-20 w-[70px]">CELL</th>
                                </tr>
                            </thead>
                            <tbody id="history-tbody" class="text-[11px] font-mono divide-y divide-slate-100">
                                <tr>
                                    <td colspan="11" class="py-4 text-center text-slate-400">Cargando historial...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Archivo de Lógica JavaScript -->
    <script src="tciclo.js"></script>
</body>
</html>
