<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es" translate="no">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SMRC Project Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}


body{
background:
linear-gradient(
135deg,
#071B34,
#0D2E57,
#0A6ED1
);


min-height:100vh;
color:white;
overflow-x:hidden;
}


body::before{
content:"";
position:fixed;
width:700px;
height:700px;
background:#00d4ff22;
border-radius:50%;
filter:blur(120px);
top:-200px;
left:-200px;
z-index:-1;
}



body::after{
content:"";
position:fixed;
width:600px;
height:600px;
background:#00ffcc22;
border-radius:50%;
filter:blur(120px);
bottom:-200px;
right:-200px;
z-index:-1;
}


header{
height:80px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
background:#ffffff14;
backdrop-filter:blur(18px);
border-bottom:1px solid #ffffff22;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo i{
font-size:35px;
color:#33E3FF;
}


.logo h1{
font-size:24px;
}


.right{
display:flex;
gap:20px;
}

.right i{
font-size:22px;
}


.container{
width:95%;
max-width:1700px;
margin:auto;
padding:30px;
}

.title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}


.title h2{
font-size:35px;
font-weight:600;
}


.title span{
color:#4CE3FF;
}


.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-bottom:35px;
}


.card{
background:#ffffff14;
backdrop-filter:blur(15px);
border-radius:22px;
padding:30px;
border:1px solid #ffffff22;
position:relative;
overflow:hidden;
transition:.3s;
}


.card:hover{
transform:translateY(-8px);
}


.card h4{
color:#ddd;
font-weight:400;
margin-bottom:15px;
}


.card h1{
font-size:45px;
}


.card i{
position:absolute;
right:25px;
bottom:25px;
font-size:42px;
opacity:.25;
}


.toolbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
margin-bottom:30px;
}

.search{
flex:1;
position:relative;
}


.search input{
width:100%;
padding:17px 55px;
border:none;
outline:none;
border-radius:15px;
background:#ffffff14;
color:white;
font-size:16px;
}


.search i{
position:absolute;
left:20px;
top:18px;
}



button{
padding:15px 25px;
border:none;
border-radius:15px;
background:#00C8FF;
color:white;
font-weight:600;
cursor:pointer;
transition:.3s;
}



button:hover{
transform:scale(1.05);
}


.table-card{
background:#ffffff14;
backdrop-filter:blur(18px);
border-radius:25px;
padding:25px;
border:1px solid #ffffff22;
overflow:hidden;
}


.table-scroll{
max-height:500px;
overflow-y:auto;
overflow-x:auto;
border-radius:15px;
}


thead th{
position:sticky;
top:0;
z-index:5;
background:#0A6ED5;
}


.table-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.table-header h3{
font-size:24px;
}
table{
width:100%;
border-collapse:collapse;
}

thead{
background:#0A6ED155;
}

th{
padding:18px;
text-align:left;
font-weight:600;
}


td{
padding:18px;
border-top:1px solid #ffffff15;
}


tbody tr{
transition:.3s;
}

tbody tr:hover{
background:#ffffff12;
}


.progress{
height:10px;
background:#ffffff22;
border-radius:20px;
overflow:hidden;
margin-bottom:5px;
}


.bar{
height:100%;
background:linear-gradient(
90deg,
#00d2ff,
#00ffc8
);
border-radius:20px;
}


.status{
padding:8px 15px;
border-radius:20px;
font-size:13px;
font-weight:600;
}


.process{
background:#2196F333;
color:#7fd7ff;
}
.waiting{
background:#ff980033;
color:#ffd56d;
}
.finish{
background:#00C85333;
color:#6bff8d;
}

.icon{
width:38px;
height:38px;
padding:0;
margin-right:5px;
border-radius:10px;
}


.view{
background:#2196F3;
}


.view{
background:#2196F3;
}


html{
    font-size:14px;
}


body{
    zoom:0.85;
}


header{
    height:65px;
    padding:0 25px;
}


.logo i{
    font-size:28px;
}


.logo h1{
    font-size:20px;
}


.container{
    width:92%;
    max-width:1500px;
    padding:20px;
}


.title h2{
    font-size:26px;
}

.cards{
    gap:18px;
}


.card{
    padding:20px;
    border-radius:18px;
}


.card h4{
    font-size:14px;
}


.card h1{
    font-size:34px;
}


.card i{
    font-size:35px;
}



.search input{
    padding:12px 45px;
    font-size:14px;
}


button{
    padding:12px 18px;
    font-size:14px;
}



.table-card{
    padding:18px;
}


.table-header h3{
    font-size:20px;
}


th{
    padding:12px;
    font-size:13px;
}


td{
    padding:12px;
    font-size:13px;
}



.icon{
    width:32px;
    height:32px;
}
.header-btn{
background:transparent;
border:none;
color:white;
font-size:22px;
cursor:pointer;
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
border-radius:10px;
transition:.3s;
}

.header-btn:hover{
background:#ffffff22;
transform:scale(1.1);
}

.header-btn i{
font-size:22px;
}

/* === DISEÑO RESPONSIVO Y CORRECCIÓN MÓVIL === */
@media(max-width: 1024px) {
    header {
        padding: 0 20px;
        height: auto;
        flex-direction: column;
        gap: 15px;
        padding-top: 15px;
        padding-bottom: 15px;
    }
    .toolbar {
        flex-direction: column;
        align-items: stretch;
    }
    .search {
        width: 100%;
    }
    .container {
        width: 98%;
        padding: 15px;
    }
}

@media(max-width: 768px) {
    .cards {
        grid-template-columns: 1fr;
    }
    .card h1 {
        font-size: 32px;
    }
    .title h2 {
        font-size: 24px;
    }
}

</style>
<body>


<header>
<div class="logo">
<i class="fa-solid fa-layer-group"></i>
<h1>SMRC Project Management</h1>
</div>


<div class="right">

<button class="header-btn" onclick="exportarExcel()">
<i class="fa-solid fa-file-excel"></i>
</button>
</div>
</header>


<div class="container">
<div class="title">
</div>


<div class="cards">
<div class="card">

<h4>Total Projects</h4>
<h1 id="totalProjects">0</h1>
<i class="fa-solid fa-folder-open"></i>
</div>

<div class="card">
<h4>In Process</h4>
<h1 id="processProjects">0</h1>
<i class="fa-solid fa-spinner"></i>
</div>


<div class="card">
<h4>Completed</h4>
<h1 id="completeProjects">0</h1>
<i class="fa-solid fa-circle-check"></i>
</div>


<div class="card">
<h4>Waiting</h4>
<h1 id="waitingProjects">0</h1>
<i class="fa-solid fa-triangle-exclamation"></i>
</div>

<div class="card">
<h4>Average Completion</h4>
<h1 id="averageProgress">0%</h1>
<i class="fa-solid fa-chart-line"></i>
</div>
</div>


<div class="toolbar">
<div class="search">
<i class="fa fa-search"></i>
<input 
id="buscar"
type="text"
placeholder="Buscar proyecto...">
</div>


<button onclick="window.location.href='Projects_Agregar.html'">
    <i class="fa-solid fa-plus"></i> + New Project
</button>
</div>
</div>


<div class="table-card">
<div class="table-header">
<h3>
<i class="fa-solid fa-diagram-project"></i>
Project Database
</h3>
</div>

<div class="table-scroll">
<table>
<thead>
<tr>
<th>ID</th>
<th>Folio</th>
<th>Project Name</th>
<th>Type</th>
<th>Lead</th>
<th>Date Start</th>
<th>Date End</th>
<th>Progress</th>
<th>Approved</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>


<tbody id="tablaProjects">
</tbody>
</table>
</div>

<script>

const supabaseUrl = 
"https://mrxtqmvufmlozplszfxc.supabase.co";

const supabaseKey = 
"sb_publishable_jlCWFKk3xQnfvcjH1PfywQ_cJqILkk-";

const supabaseClient = supabase.createClient(
    supabaseUrl,
    supabaseKey
);

let proyectos = [];

async function cargarProjects(){
console.log("Cargando Projects...");
const {data,error}= await supabaseClient
.from("Projects")
.select(`
id,
Folio,
ProjectName,
Type,
Lead,
DateStart,
DateEnd,
Progress,
Approved,
Status
`)
.order("Folio");
if(error){
console.error(
"Error Supabase:",
error
);


document.getElementById("tablaProjects").innerHTML=`
<tr>
<td colspan="11">
❌ Error cargando datos:
${error.message}
</td>
</tr>
`;
return;
}

console.log(
"Datos recibidos:",
data
);

proyectos=data;
mostrarProjects(data);
actualizarKPIs(data);
}

function mostrarProjects(data){
const tabla =
document.getElementById(
"tablaProjects"
);

tabla.innerHTML="";
data.forEach(project=>{
tabla.innerHTML += `
<tr>
<td>${project.id}</td>
<td>${project.Folio ?? ""}
</td>


<td>
${project.ProjectName ?? ""}
</td>

<td>
${project.Type ?? ""}
</td>

<td>
${project.Lead ?? ""}
</td>

<td>
${project.DateStart ?? ""}
</td>

<td>
${project.DateEnd ?? ""}
</td>

<td>
<div class="progress">
<div class="bar"
style="
width:${project.Progress ?? 0}%
">
</div>
</div>

${project.Progress ?? 0}%
</td>

<td>
${project.Approved ?? ""}
</td>

<td>
<span class="status process">
${project.Status ?? ""}
</span>
</td>

<td>
<button
class="icon view"
onclick="verProyecto(${project.id})">
<i class="fa-solid fa-eye"></i>
</button>
</td>
</tr>
`;
});
}

function actualizarKPIs(data){
document.getElementById(
"totalProjects"
).innerHTML = data.length;

document.getElementById(
"processProjects"
).innerHTML =
data.filter(
p => p.Status == "En Proceso"
).length;

document.getElementById(
"completeProjects"
).innerHTML =

data.filter(
p => p.Status == "Completado"
).length;

document.getElementById(
"waitingProjects"
).innerHTML =

data.filter(
p => p.Status == "En Espera"
).length;

let totalProgress = data.reduce(
(sum, project) =>
sum + Number(project.Progress || 0),
0
);

let averageProgress = 0;
if(data.length > 0){
    averageProgress = totalProgress / data.length;
}

document.getElementById(
"averageProgress"
).innerHTML =
averageProgress.toFixed(1) + "%";
}

document
.getElementById("buscar")
.addEventListener(
"keyup",
function(){

let texto=this.value
.toLowerCase();

let filtrados =
proyectos.filter(p=>

JSON.stringify(p)
.toLowerCase()
.includes(texto)
);

mostrarProjects(
filtrados
);
});


function verProyecto(id){
    window.open(
        "Project_Detail.html?id="+id,
        "_blank"
    );
}

cargarProjects();

function exportarExcel(){
if(proyectos.length === 0){
alert("No hay proyectos para exportar");
return;
}


let datos = proyectos.map(p => ({
Folio:p.Folio,
ProjectName:p.ProjectName,
Type:p.Type,
Lead:p.Lead,
DateStart:p.DateStart,
DateEnd:p.DateEnd,
Progress:p.Progress,
Approved:p.Approved,
Status:p.Status
}));

let hoja = XLSX.utils.json_to_sheet(datos);
let libro = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(
libro,
hoja,
"Projects"
);

XLSX.writeFile(
libro,
"Projects_List.xlsx"
);
}

</script>
</body>
</html>
