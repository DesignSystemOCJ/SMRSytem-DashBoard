<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMRC System | Industrial Control</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    :root {
      --bg-main: #eef2f6;
      --sidebar-bg: #ffffff;
      --sidebar-border: #e2e8f0;
      --accent-blue: #0a6ed1;
      --accent-cyan: #0284c7;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --status-green: #10b981;
      --hover-bg: #f1f5f9;
      --active-bg: #e0f2fe;
      --sidebar-collapsed-width: 70px;
      --sidebar-expanded-width: 220px;
    }

    body {
      height: 100vh;
      background: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
      display: flex;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 80% 20%, rgba(10, 110, 209, 0.04), transparent 50%),
                  radial-gradient(circle at 20% 80%, rgba(2, 132, 199, 0.04), transparent 50%);
      pointer-events: none;
    }

     .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: var(--sidebar-collapsed-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 4px 0 25px rgba(15, 23, 42, 0.04);
      transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar:hover {
      width: var(--sidebar-expanded-width);
    }

    .sidebar-header {
      padding: 18px 14px;
      border-bottom: 1px solid var(--sidebar-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-brand-icon {
      min-width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 10px;
      font-size: 18px;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(10, 110, 209, 0.3);
    }

    .sidebar-brand-info {
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .sidebar:hover .sidebar-brand-info {
      opacity: 1;
    }

    .sidebar-brand-info h2 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .sidebar-brand-info h2 span {
      color: var(--accent-blue);
    }

    .sidebar-brand-info small {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

     .sidebar-menu {
      list-style: none;
      padding: 12px 0;
      flex-grow: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-menu::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar-menu::-webkit-scrollbar-thumb {
      background: var(--sidebar-border);
      border-radius: 4px;
    }

    .sidebar-item {
      width: 100%;
      margin-bottom: 4px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0 20px;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
    }

    .sidebar-link i {
      font-size: 18px;
      min-width: 28px;
      text-align: center;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .sidebar-link span {
      margin-left: 12px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .sidebar:hover .sidebar-link span {
      opacity: 1;
    }

    .sidebar-link:hover {
      color: var(--accent-blue);
      background: var(--hover-bg);
    }

    .sidebar-link:hover i {
      transform: scale(1.1);
    }

    .sidebar-link.active {
      color: var(--accent-blue);
      background: var(--active-bg);
    }

    .sidebar-link.active::before,
    .sidebar-link:hover::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: var(--accent-blue);
      border-radius: 0 3px 3px 0;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #f8fafc;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      min-width: 8px;
      height: 8px;
      background: var(--status-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--status-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      opacity: 0;
      transition: opacity 0.2s ease;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar:hover .status-text {
      opacity: 1;
    }

    .clock-box {
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .sidebar:hover .clock-box {
      opacity: 1;
    }

    #time {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    #date {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 500;
    }

    .main-content {
      margin-left: var(--sidebar-collapsed-width);
      width: calc(100vw - var(--sidebar-collapsed-width));
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: margin-left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
   
    #welcome-logo {
      max-width: 65%;
      max-height: 65%;
      object-fit: contain;
      filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.08));
      transition: opacity 0.3s ease;
    }

    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
  </style>
</head>

<body>
  <div class="background"></div>
    <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand-icon">
        <i class="fa-solid fa-cube"></i>
      </div>
      <div class="sidebar-brand-info">
        <h2>SMRC <span>System</span></h2>
        <small>Industrial Control</small>
      </div>
    </div>

    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <a href="ManttoIssues.html" target="content-frame" class="sidebar-link">
          <i class="fa-solid fa-industry"></i>
          <span>Mantto Issues</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="ScrapMrb.html" target="content-frame" class="sidebar-link">
          <i class="fa-solid fa-recycle"></i>
          <span>Scrap</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="EhsAudits.html" target="content-frame" class="sidebar-link">
          <i class="fa-solid fa-shield-halved"></i>
          <span>EHS Audits</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="Accidents.html" target="content-frame" class="sidebar-link">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>Accidents</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="bu.html" target="content-frame" class="sidebar-link">
          <i class="fa-solid fa-building"></i>
          <span>B&amp;U</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="Projects.html" target="content-frame" class="sidebar-link">
          <i class="fa-solid fa-diagram-project"></i>
          <span>Projects</span>
        </a>
      </li>
      <li class="sidebar-item">
        <a href="Configuracion.html" target="content-frame" class="sidebar-link">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <div class="status">
        <span class="dot"></span>
        <span class="status-text">System Online</span>
      </div>

      <div class="clock-box">
        <div id="time">00:00:00</div>
        <div id="date">Loading date...</div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <img id="welcome-logo" src="https://controlaccesosysistemas.com/wp-content/uploads/2022/03/prime-wheel-980x980.png" alt="Company Logo">
    <iframe name="content-frame" id="main-iframe" class="content-frame"></iframe>
  </main>

  <script>
    const timeElement = document.getElementById("time");
    const dateElement = document.getElementById("date");

    const dateOptions = {
      weekday: "short",
      year: "numeric",
      month: "short",
      day: "numeric"
    };

    function updateClock() {
      const now = new Date();
      timeElement.textContent = now.toTimeString().split(' ')[0];
      dateElement.textContent = now.toLocaleDateString("en-US", dateOptions);
    }

    setInterval(updateClock, 1000);
    updateClock();

    const links = document.querySelectorAll('.sidebar-link');
    const welcomeLogo = document.getElementById('welcome-logo');
    const iframe = document.getElementById('main-iframe');

    links.forEach(link => {
      link.addEventListener('click', (e) => {
        links.forEach(l => l.classList.remove('active'));
        link.classList.add('active');
        welcomeLogo.style.display = 'none';
        iframe.style.display = 'block';
      });
    });
  </script>
</body>
</html>
