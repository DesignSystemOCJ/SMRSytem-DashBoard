<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<title>Consulta Auditorías EHS</title>
<style>

:root{
--sap-blue:#0a6ed1;
--sap-dark:#082b4c;
--sap-turquoise:#00a6a6;
--sap-light:#f4f7fb;
--sap-gray:#5b6b7a;
--white:#ffffff;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"Segoe UI",Arial,sans-serif;
height:100vh;
overflow:hidden;
background:
linear-gradient(
135deg,
#041d38,
#073763,
#0a6ed1
);
padding:20px;
color:#1e293b;
display:flex;
flex-direction:column;
}

.header{
width:98%;
max-width:1800px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
color:white;
margin-bottom:15px;
flex-shrink:0;
}

.header h1{
font-size:32px;
margin:0;
letter-spacing:.5px;
}

.header span{
color:#7de2e2;
}

.contenedor{
width:99%;
max-width:2200px;
margin:auto;
background:
rgba(255,255,255,.88);
backdrop-filter:blur(18px);
border-radius:22px;
padding:30px;
box-shadow:
0 25px 60px rgba(0,0,0,.25);
border:
1px solid rgba(255,255,255,.4);
display:flex;
flex-direction:column;
height:calc(100vh - 80px);
overflow:hidden;
}

#mensaje{
margin-bottom:15px;
padding:14px;
border-radius:12px;
background:#eef6ff;
color:var(--sap-blue);
font-weight:600;
text-align:center;

flex-shrink:0;
}

.table-container{
flex:1;
overflow-y:auto;
overflow-x:auto;
border-radius:16px;
background:white;
position:relative;
}

table{
width:100%;
border-collapse:separate;
border-spacing:0;
background:white;
}


thead th{
position:sticky;
top:0;
background:#0a6ed1;
color:white;
z-index:10;

}

th{
padding:15px;
font-size:14px;
text-align:center;
white-space:nowrap;
}

td{
padding:14px;
border-bottom:1px solid #e5e7eb;
font-size:14px;
text-align:center;
vertical-align:middle;
}

tbody tr{
transition:.25s;
}

tbody tr:hover{
background:#eef7ff;
transform:scale(1.005);
}

button{
background:
linear-gradient(
135deg,
#0a6ed1,
#00a6a6
);

border:none;
color:white;
padding:10px 18px;
border-radius:30px;
font-weight:600;
cursor:pointer;
box-shadow:
0 8px 18px rgba(10,110,209,.35);
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:
0 12px 25px rgba(0,166,166,.5);
}

.pdf-icon{
font-size:18px;
}

@media(max-width:900px){

body{
padding:15px;
}

.header{
display:block;
}

.header h1{
font-size:24px;
}

.contenedor{
padding:15px;
}

table{
font-size:12px;
}

th,td{
padding:10px;
}
}

.loading{
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{
opacity:.5;
}
}

.toolbar{
display:flex;
gap:15px;
margin-bottom:18px;
flex-wrap:wrap;
}

.toolbar button{

padding:12px 22px;
border:none;
border-radius:40px;
font-size:15px;
font-weight:600;
cursor:pointer;
transition:.30s;
color:white;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.titulo-modulo{

margin:0;
font-size:32px;
font-weight:700;
color:#0a3d62;
display:flex;
align-items:center;
gap:12px;

}

.titulo-modulo i{
color:#0a6ed1;
font-size:30px;
}

.toolbar{
display:flex;
align-items:center;
gap:12px;
}

.icon-btn{
width:48px;
height:48px;
border:none;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:20px;
color:white;
transition:.30s;
box-shadow:
0 10px 20px rgba(0,0,0,.18);
}

.icon-btn:hover{
transform:translateY(-4px) scale(1.08);
box-shadow:
0 15px 28px rgba(0,0,0,.28);
}

.btn-add{
background:linear-gradient(135deg,#00b894,#00cec9);
}

.btn-excel{
background:linear-gradient(135deg,#2e7d32,#66bb6a);
}

.btn-pdf{
background:linear-gradient(135deg,#d63031,#ff7675);
}

.btn-refresh{
background:linear-gradient(135deg,#0984e3,#74b9ff);
}

</style>
</head>
<body>
<div class="header" style="display:none;">
</div>

<div class="contenedor">
<div class="topbar">

    <h2 class="titulo-modulo">
        <i class="fa-solid fa-shield-halved"></i>
        EHS Audit
    </h2>

 <div class="toolbar">
    <!-- HOME -->
    <button class="icon-btn btn-home"
            onclick="window.location.href='Menu.html'"
            title="Inicio">
        <i class="fa-solid fa-house"></i>
    </button>

    <button class="icon-btn btn-add"
            onclick="abrirFormulario()"
            title="Nueva Auditoría">
        <i class="fa-solid fa-plus"></i>
    </button>

    <button class="icon-btn btn-excel"
            onclick="exportarExcel()"
            title="Exportar Excel">
        <i class="fa-solid fa-file-excel"></i>
    </button>

    <button class="icon-btn btn-pdf"
            onclick="exportarPDF()"
            title="Exportar PDF">
        <i class="fa-solid fa-file-pdf"></i>
    </button>

    <button class="icon-btn btn-refresh"
            onclick="location.reload()"
            title="Actualizar">
        <i class="fa-solid fa-rotate-right"></i>
    </button>

</div>
</div>


<div id="mensaje" class="loading">🔄 Connecting to the SAP EHS Database...</div>

<div class="table-container">
<table id="tabla">
<thead>

<tr>
<th>Folio</th>
<th>Plant</th>
<th>Shift</th>
<th>Area</th>
<th>EHS</th>
<th>Gerente</th>
<th>Fecha</th>
<th>Status</th>
<th>C/O</th>
<th>Descripción</th>
<th>PDF</th>

</tr>
</thead>
<tbody>
</tbody>
</table>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js";

const supabaseUrl =
"https://mrxtqmvufmlozplszfxc.supabase.co";

const supabaseKey =
"sb_publishable_jlCWFKk3xQnfvcjH1PfywQ_cJqILkk-";

const supabase = createClient(
    supabaseUrl,
    supabaseKey
);


async function cargar(){
   const { data, error } = await supabase
    .from("Auditorias_Gestion_EHS")
    .select("*")
    .order("Folio",{ascending:false});
    if(error){
        document.getElementById("mensaje").innerHTML =
        "❌ Connection Error: " + error.message;
        return;
    }
    const cuerpo = document.querySelector("#tabla tbody");
    cuerpo.innerHTML = "";
    data.forEach(row=>{
        let pdf = "No document";
        if(row.PDF){
            pdf = `
            <a href="${row.PDF}" target="_blank">
                <button>
                    <span class="pdf-icon">📎</span>               
                </button>
            </a>
            `;
        }
        cuerpo.innerHTML += `
        <tr>
            <td>${row.Folio ?? ""}</td>
            <td>${row.Plant ?? ""}</td>
            <td>${row.Shift ?? ""}</td>
            <td>${row.Area ?? ""}</td>
            <td>${row.EHSName ?? ""}</td>
            <td>${row.Gerente ?? ""}</td>
            <td>${row.Fecha ?? ""}</td>
            <td>${row.Status ?? ""}</td>
            <td>${row["C/O"] ?? ""}</td>
            <td>${row.Description ?? ""}</td>
            <td>${pdf}</td>
        </tr>
        `;
    });


    const total = data.length;
    const inProcess = data.filter(r =>
        (r.Status ?? "").trim().toUpperCase() === "IN PROCESS"
    ).length;

    const open = data.filter(r =>
    (r["C/O"] ?? "").trim().toUpperCase() === "OPEN"
).length;

    const closed = data.filter(r =>
    (r["C/O"] ?? "").trim().toUpperCase() === "CLOSED"
).length;

    const co = data.filter(r =>
    (r["C/O"] ?? "").toString().trim() !== ""
    ).length;

    document.getElementById("mensaje").innerHTML = `
        ✅ <strong>Available Audits:</strong> ${total}
        &nbsp;&nbsp;|&nbsp;&nbsp;
        🟡 <strong>In Process:</strong> ${inProcess}
        &nbsp;&nbsp;|&nbsp;&nbsp;
        🟢 <strong>C/O:</strong> ${co}
        &nbsp;&nbsp;|&nbsp;&nbsp;
        🔵 <strong>Open:</strong> ${open}
        &nbsp;&nbsp;|&nbsp;&nbsp;
        ⚫ <strong>Closed:</strong> ${closed}
    `;
    document
        .getElementById("mensaje")
        .classList.remove("loading");
}

window.abrirFormulario = function(){
    document.getElementById("loginModal").style.display="flex";
}

window.cerrarLogin = function(){
    document.getElementById("loginModal").style.display="none";
    document.getElementById("loginUsuario").value="";
    document.getElementById("loginPassword").value="";
    document.getElementById("errorLogin").innerHTML="";
}

window.validarAcceso = async function(){
    const usuario =
    document.getElementById("loginUsuario").value.trim();

    const password =
    document.getElementById("loginPassword").value.trim();

    const { data, error } = await supabase
        .from("Cuentas")
        .select("*")
        .eq("Usurio", usuario)
        .single();

    if(error){
        document.getElementById("errorLogin").innerHTML =
        "❌ Error: " + error.message;
        return;
    }


    if(data.Password.trim() === password){
        window.location.href =
        "HallazgosEHSIngresar.html";
    }else{
        document.getElementById("errorLogin").innerHTML =
        "❌ Usuario o contraseña incorrectos";
    }
}

window.exportarExcel = function(){
    let tabla = document.getElementById("tabla");
    let libro = XLSX.utils.table_to_book(tabla,{
        sheet:"Auditorias"
    });
    XLSX.writeFile(libro,"Auditorias_EHS.xlsx");
}

window.exportarPDF = function(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("l","mm","a4");
    doc.setFontSize(18);
    doc.text("EHS Audit Report",14,15);
    doc.autoTable({
        html:"#tabla",
        startY:25,
        styles:{
            fontSize:8
        }
    });
    doc.save("Auditorias_EHS.pdf");
}
cargar();

window.mostrarPassword = function(){
    document.getElementById("loginPassword").type="text";
    document.getElementById("verPassword").className =
    "fa-solid fa-eye-slash";
}

window.ocultarPassword = function(){
    document.getElementById("loginPassword").type="password";
    document.getElementById("verPassword").className =
    "fa-solid fa-eye";
}

</script>

<div id="loginModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
align-items:center;
justify-content:center;
z-index:9999;
">

<div style="
background:white;
padding:30px;
border-radius:20px;
width:350px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
">

<h2 style="text-align:center;color:#0a6ed1;">
<i class="fa-solid fa-user-lock"></i>
 Acceso
</h2>

<label>Usuario</label>
<input id="loginUsuario" 
type="text"
style="
width:100%;
padding:12px;
margin:8px 0 15px;
border-radius:10px;
border:1px solid #ccc;
">

<label>Password</label>
<div style="position:relative;">
<input id="loginPassword" 
type="password"
style="
width:100%;
padding:12px 45px 12px 12px;
margin:8px 0 20px;
border-radius:10px;
border:1px solid #ccc;
">


<i class="fa-solid fa-eye"
id="verPassword"
style="
position:absolute;
right:15px;
top:20px;
cursor:pointer;
color:#0a6ed1;
font-size:18px;
"
onmouseenter="mostrarPassword()"
onmouseleave="ocultarPassword()"
></i>
</div>

<button onclick="validarAcceso()" 
style="width:100%">
Ingresar
</button>

<button onclick="cerrarLogin()"
style="
width:100%;
margin-top:10px;
background:#777;
">
Cancel
</button>

<p id="errorLogin"
style="
color:red;
text-align:center;
font-weight:bold;
">
</p>

</div>
</div>
</body>
</html>
