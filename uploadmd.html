<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Machine | SMRC System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="uploadmd.css">
</head>
<body>

<main class="container">
    <header class="header-title">
        <i class="fa-solid fa-layer-group"></i>
        <h2>MD Machine</h2>
    </header>

    <section id="csvContainer">
        <label for="csvFileInput">Upload CSV file</label>
        <div class="drop-zone" id="dropZone">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="fileLabel">Drag your CSV file here or click to select it from your files</span>
            <input type="file" id="csvFileInput" id-label="csvFileInput" accept=".csv" />
        </div>

        <label for="pasteTextarea">Or paste your data (CSV / Tabular)</label>
        <textarea id="pasteTextarea" placeholder="Week,Month,Date,...&#10;1,January,2026-01-01,..."></textarea>
    </section>
    
    <button class="neo-btn" id="enviarBtn" type="button">
        <i class="fa-solid fa-paper-plane"></i> Submit Data
    </button>

    <div id="mensajeEstado" role="status" aria-live="polite"></div>
</main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="uploadmd.js" defer></script>

</body>
</html>
