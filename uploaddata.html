<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Datos | SMRC System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="uploaddatas.css">
</head>
<body>

<div class="container">
    <div class="header-title">
        <i class="fa-solid fa-layer-group"></i>
        <h2>Upload Information | SMRC System</h2>
    </div>
    
    <label for="tablaSelect">Select Table</label>
    <div class="select-wrapper">
        <select id="tablaSelect">
            <option value="ManttoIssues">Maintenance Issues Data</option>
            <option value="Scrap">Non-Conforming Material Data</option>
            <option value="bupercen">Balance & Uniformity Data</option>
            <option value="BUStatus">B&U Status</option> <!-- NUEVA OPCIÓN -->
            <option value="Production">Production Status</option>
        </select>
        <i class="fa-solid fa-chevron-down" id="selectArrow"></i>
    </div>

    <div id="formBUStatusContainer" style="display: none;">
        <div class="prod-header-info">
            <span><i class="fa-solid fa-chart-line"></i> B&U Status Entry Panel</span>
            <span></span>
        </div>

        <div class="prod-row">
            <div class="prod-field-group">
                <label for="buWeek"><i class="fa-solid fa-calendar-week"></i> Week</label>
                <input type="number" id="buWeek" placeholder="Ej. 1">
            </div>

            <div class="prod-field-group">
                <label for="buDate"><i class="fa-solid fa-calendar-days"></i> Date</label>
                <input type="date" id="buDate">
            </div>
        </div>

        <div class="prod-field-group full-width">
            <label for="buMonth"><i class="fa-solid fa-calendar-alt"></i> Month</label>
            <input type="text" id="buMonth" disabled>
        </div>

        <div class="prod-row">
            <div class="prod-field-group">
                <label for="buQty"><i class="fa-solid fa-boxes-stacked"></i> Qty</label>
                <input type="number" id="buQty" placeholder="Ej. 100">
            </div>

            <div class="prod-field-group">
                <label for="buProd"><i class="fa-solid fa-industry"></i> Prod</label>
                <input type="number" id="buProd" placeholder="Ej. 95">
            </div>
        </div>

        <div class="prod-row">
            <div class="prod-field-group">
                <label for="buPercent"><i class="fa-solid fa-percent"></i> Percent</label>
                <input type="number" step="0.01" id="buPercent" placeholder="Ej. 95.5">
            </div>

            <div class="prod-field-group">
                <label for="buGoal"><i class="fa-solid fa-bullseye"></i> Goal</label>
                <input type="text" id="buGoal" value="0.0150" disabled>
            </div>
        </div>
    </div>

    <div id="formProductionContainer" style="display: none;">
        <div class="prod-header-info">
            <span><i class="fa-solid fa-industry"></i> Production Entry Panel</span>
            <span></span>
        </div>

        <div class="prod-field-group full-width">
            <label for="prodDate"><i class="fa-solid fa-calendar-days"></i> Date</label>
            <input type="date" id="prodDate">
        </div>

        <div class="prod-field-group full-width">
            <label for="prodMonth"><i class="fa-solid fa-calendar-alt"></i> Month </label>
            <input type="text" id="prodMonth" placeholder="" disabled>
        </div>

        <div class="prod-row">
            <div class="prod-field-group">
                <label for="prodRunning"><i class="fa-solid fa-gauge-high"></i> Production Shift</label>
                <input type="number" id="prodRunning" placeholder="Ej. 1500">
            </div>

            <div class="prod-field-group">
                <label for="prodScrap"><i class="fa-solid fa-triangle-exclamation"></i> Scrap</label>
                <input type="number" id="prodScrap" placeholder="Ej. 12">
            </div>
        </div>

        <div class="prod-field-group full-width">
            <label for="prodAveg"><i class="fa-solid fa-percent"></i> %Aveg Efficiency</label>
            <input type="number" step="0.01" id="prodAveg" placeholder="Ej. 0.0126">
        </div>
    </div>

    <div id="csvContainer">
        <label>Upload CSV file</label>
        <div class="drop-zone" id="dropZone">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="fileLabel">Drag your CSV file here or click to select it from your files</span>
            <input type="file" id="csvFileInput" accept=".csv" />
        </div>

        <label for="pasteTextarea">Or paste your data (CSV / Tabular)</label>
        <textarea id="pasteTextarea" placeholder="Week,Month,Date,Qty,Prod,Percent,Goal&#10;1,Enero,2026-01-01,100,95,95,100"></textarea>
    </div>
    
    <button class="neo-btn" id="enviarBtn">
        <i class="fa-solid fa-paper-plane"></i> Submit Data
    </button>

    <div id="mensajeEstado"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="uploaddata.js"></script>

<script>
    const selectElem = document.getElementById('tablaSelect');
    const arrowElem = document.getElementById('selectArrow');

    selectElem.addEventListener('focus', () => {
        arrowElem.style.transform = 'translateY(-50%) rotate(180deg)';
    });
    selectElem.addEventListener('blur', () => {
        arrowElem.style.transform = 'translateY(-50%) rotate(0deg)';
    });
    selectElem.addEventListener('change', () => {
        arrowElem.style.transform = 'translateY(-50%) rotate(0deg)';
        selectElem.blur();
    });
</script>

</body>
</html>
