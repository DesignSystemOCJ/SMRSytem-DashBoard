<!DOCTYPE html>
<html lang="es" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Consulta Auditorías EHS</title>
    <link rel="stylesheet" href="EhsAuditss.css">
</head>
<body>

<div class="contenedor">
    <div class="topbar">
        <h2 class="titulo-modulo">
        EHS Audit Dashboard
        </h2>

        <div class="toolbar">
            <div class="custom-select-wrapper" id="customSelectAnio">
                <input type="hidden" id="filtroAnio" value="2026">
                <div class="custom-select-btn" onclick="toggleDropdown(event)">
                    <div class="custom-select-icon">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <div class="custom-select-text">
                        <span class="custom-select-label">YEAR</span>
                        <span class="custom-select-value" id="customSelectValue">2026 <i class="fa-solid fa-chevron-down"></i></span>
                    </div>
                </div>
                <div class="custom-dropdown" id="customDropdownList">
                    <div class="custom-option" onclick="seleccionarAnio('ALL', 'Todos los Años')">Todos los Años</div>
                    <div class="custom-option" onclick="seleccionarAnio('2024', '2024')">2024</div>
                    <div class="custom-option" onclick="seleccionarAnio('2025', '2025')">2025</div>
                    <div class="custom-option selected" onclick="seleccionarAnio('2026', '2026')">2026</div>
                    <div class="custom-option" onclick="seleccionarAnio('2027', '2027')">2027</div>
                </div>
            </div>

            <button class="icon-btn btn-view-table" onclick="abrirModalTabla()" title="View">
                <i class="fa-solid fa-eye"></i>
            </button>

            <button class="icon-btn btn-excel" onclick="exportarExcel()" title="Export Excel">
                <i class="fa-solid fa-file-excel"></i>
            </button>

            <button class="icon-btn btn-pdf" onclick="exportarPDF()" title="Export PDF">
                <i class="fa-solid fa-file-pdf"></i>
            </button>

            <button class="icon-btn btn-refresh" onclick="cargarDatos()" title="Actualizar">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div id="mensaje" class="loading">🔄 Connecting to the SAP EHS Database...</div>

      <div class="cards-container">
        <div class="card" style="border-left-color: #0a6ed1;">
            <h3>Total Audits</h3>
            <p class="card-value" id="cardTotal">0</p>
            <i class="fa-solid fa-clipboard-list card-icon" style="color: #0a6ed1;"></i>
        </div>
        <div class="card" style="border-left-color: #f39c12;">
            <h3>Open</h3>
            <p class="card-value" id="cardOpen">0</p>
            <i class="fa-solid fa-folder-open card-icon" style="color: #f39c12;"></i>
        </div>
        <div class="card" style="border-left-color: #27ae60;">
            <h3>Closed</h3>
            <p class="card-value" id="cardClosed">0</p>
            <i class="fa-solid fa-circle-check card-icon" style="color: #27ae60;"></i>
        </div>
        <div class="card" style="border-left-color: #00cec9;">
            <h3>In Process</h3>
            <p class="card-value" id="cardInProcess">0</p>
            <i class="fa-solid fa-spinner card-icon" style="color: #00cec9;"></i>
        </div>
        <div class="card" style="border-left-color: #6c5ce7;">
            <h3>% Progress</h3>
            <p class="card-value" id="cardProgress">0%</p>
            <i class="fa-solid fa-chart-line card-icon" style="color: #6c5ce7;"></i>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <h4>Audits by Shift</h4>
            <div class="chart-container">
                <canvas id="chartShift"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <h4>Audits by Month</h4>
            <div class="chart-container">
                <canvas id="chartMonth"></canvas>
            </div>
        </div>
        <div class="chart-card full-width">
            <h4>Issues Per Day</h4>
            <div class="chart-container">
                <canvas id="chartIssuesDay"></canvas>
            </div>
        </div>
    </div>
</div>

<div id="tableModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-table"></i> Audit Details EHS</h3>
            <button class="close-modal" onclick="cerrarModalTabla()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="table-container">
            <table id="tabla">
                <thead>
                    <tr>
                        <th>Folio</th>
                        <th>Plant</th>
                        <th>Shift</th>
                        <th>Area</th>
                        <th>EHS</th>
                        <th>Gerente</th>
                        <th>Fecha</th>
                        <th>Status</th>
                        <th>C/O</th>
                        <th>PDF</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="EhsAudits.js"></script>

</body>
</html>
