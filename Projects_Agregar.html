<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Add New Project</title>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="Projects_Agregars.css">
</head>

<body>

    <div class="header">
        <h1>
            <i class="fa-solid fa-diagram-project"></i>
            Project Management
            <span>New Project</span>
        </h1>
        <button class="btn-back" onclick="window.location.href='Projects.html'">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
    </div>

    <div class="container">
        <div class="folio-box">
            <i class="fa-solid fa-barcode"></i>
            Folio: <span id="folio">Generando...</span>
        </div>

        <br>

        <div class="form-grid">
            <div>
                <label>StartDate</label>
                <input type="date" id="DateStart" readonly>
            </div>

            <div>
                <label>Department</label>
                <input id="Department" readonly>
            </div>

            <div>
                <label>Project Name</label>
                <input id="ProjectName" placeholder="Project Name">
            </div>

            <div>
                <label>Type</label>
                <select id="Type">
                    <option>Select</option>
                    <option>New Project</option>
                    <option>Improvement</option>
                    <option>Corrective</option>
                </select>
            </div>

            <div style="grid-column:1/-1">
                <label>Problem Description</label>
                <textarea id="ProblemDescription" placeholder="Problem Description"></textarea>
            </div>

            <div>
                <label>Evidence Before</label>
                <div class="upload">
                    <i class="fa-solid fa-image"></i>
                    <br><br>
                    <input type="file" id="EvidenceBefore" accept="image/*">
                </div>
            </div>

            <div>
                <label>Evidence After</label>
                <div class="upload">
                    <i class="fa-solid fa-camera"></i>
                    <br><br>
                    <input type="file" id="EvidenceAfter" accept="image/*">
                </div>
            </div>

            <div>
                <label>EndDate</label>
                <input type="date" id="DateEnd">
            </div>

            <div>
                <label>Priority</label>
                <select id="Priority">
                    <option>Select</option>
                    <option>High</option>
                    <option>Medium</option>
                    <option>Low</option>
                </select>
            </div>

            <div>
                <label>Status</label>
                <select id="Status">
                    <option>Select</option>
                    <option>New</option>
                    <option>Under Review</option>
                    <option>Approved</option>
                    <option>In Progress</option>
                    <option>On Hold</option>
                    <option>Cancelled</option>
                    <option>Completed</option>
                    <option>Closed</option>
                </select>
            </div>

            <div>
                <label>Lead</label>
                <select id="Lead">
                    <option>Select</option>
                    <option>Armando Osornio</option>
                    <option>Demetrio Moreno</option>
                </select>
            </div>

            <div>
                <label>Manager</label>
                <select id="Manager">
                    <option>Select</option>
                    <option>Ernesto Guerrero</option>
                    <option>Jorge Garcia</option>
                    <option>Ervin Morales</option>
		</select>
            </div>

            <div>
                <label>Approved</label>
                <input id="Approved" placeholder="Yes / No">
            </div>

            <div>
                <label>Progress %</label>
                <input type="text" id="Progress" placeholder="0%" maxlength="4" oninput="formatoPorcentaje(this)">
            </div>

            <div style="grid-column:1/-1">
                <label>Remarks | Comments</label>
                <textarea id="RemarksComments"></textarea>
            </div>
        </div>

        <button onclick="guardarProyecto()">
            <i class="fa-solid fa-floppy-disk"></i>
            Submit Project
        </button>

        <div id="resultado">
            Ready to enter information...
        </div>
    </div>

    <!-- Enlace al archivo JS externo -->
    <script src="Projects_Agregar.js"></script>

</body>
</html>
