<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>New Project</title>
  
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="Projects_Agregars.css">
</head>

<body>

    <div class="container" style="margin-top: 40px;">
        <div class="folio-box">
            <i class="fa-solid fa-barcode"></i>
            Folio: <span id="folio">Generando...</span>
        </div>

        <div class="form-grid">
            <!-- Fila 1: Start Date - Department - Status - Approved -->
            <div class="form-group">
                <label>Start Date</label>
                <input type="date" id="DateStart" readonly>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input id="Department" readonly>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="Status" disabled>
                    <option value="New" selected>New</option>
                </select>
            </div>

            <div class="form-group">
                <label>Approved</label>
                <select id="Approved" disabled>
                    <option value="" selected></option>
                </select>
            </div>

            <!-- Fila 2: Project Name - Type - Lead -->
            <div class="form-group">
                <label>Project Name</label>
                <input id="ProjectName" placeholder="Ej. Optimización de Línea">
            </div>

            <div class="form-group">
                <label>Type</label>
                <select id="Type">
                    <option value="">Select Type</option>
                    <option>New Project</option>
                    <option>Improvement</option>
                    <option>Corrective</option>
                </select>
            </div>

            <div class="form-group">
                <label>Lead</label>
                <select id="Lead">
                    <option value="">Select Lead</option>
                    <option>Armando Osornio</option>
                    <option>Demetrio Moreno</option>
                </select>
            </div>

            <!-- Espacio vacío invisible para mantener la simetría de 4 columnas -->
            <div class="form-group" style="visibility: hidden; pointer-events: none;"></div>

            <!-- Fila 3: Problem Description -->
            <div class="form-group full-width">
                <label>Problem Description</label>
                <textarea id="ProblemDescription" placeholder="Describe el problema o necesidad del proyecto..."></textarea>
            </div>
        </div>

        <button class="btn-submit" onclick="guardarProyecto()">
            <i class="fa-solid fa-floppy-disk"></i>
            Submit Project
        </button>

        <div id="resultado">
            Ready to enter information...
        </div>
    </div>

    <script src="Projects_Agregar.js"></script>
</body>
</html>
