<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Add New Project</title>


<link 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>
*{
    box-sizing:border-box;
}


body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI",Arial,sans-serif;
    background:
    linear-gradient(
        rgba(0,40,85,.85),
        rgba(0,160,170,.55)
    ),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72")
    center/cover fixed;
    color:white;
}


.header{
    padding:25px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.header h1{
    margin:0;
    font-size:32px;
}


.header span{
    color:#5ee7df;
}


.container{
    width:90%;
    max-width:1200px;
    margin:auto;
    background:
    rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:35px;
    box-shadow:
    0 20px 50px rgba(0,0,0,.35);
}



.form-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}


label{
    font-weight:600;
    color:#dffcff;
}

input,
select,
textarea{
    width:100%;
    margin-top:8px;
    padding:13px;
    border:none;
    border-radius:12px;
    background:
    rgba(255,255,255,.85);
    color:#003b5c;
    font-size:15px;
}

textarea{
    height:110px;
    resize:none;
}


.folio-box{
    background:
    linear-gradient(
    135deg,
    #0070f3,
    #00d4d4
    );
    padding:18px;
    border-radius:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}


.upload{
    border:2px dashed #5ee7df;
    padding:25px;
    border-radius:18px;
    text-align:center;
    background:
    rgba(0,0,0,.15);
}


.upload i{
    font-size:40px;
    color:#5ee7df;
}


button{
    margin-top:30px;
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    background:
    linear-gradient(
    90deg,
    #0070f3,
    #00d4d4
    );
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.03);
    box-shadow:
    0 0 25px #00d4d4;
}

#resultado{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}

body{
    font-size:14px;
}


.header{
    padding:15px 30px;
}


.header h1{
    font-size:24px;
}



.container{
    width:85%;
    max-width:1000px;
    padding:25px;
    border-radius:20px;
}



.form-grid{
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}



input,
select,
textarea{
    padding:10px;
    font-size:14px;
    border-radius:8px;
}



textarea{
    height:90px;
}

.folio-box{
    padding:12px;
    font-size:18px;
}


.upload{
    padding:15px;
}

.upload i{
    font-size:30px;
}



button{
    padding:12px;
    font-size:16px;
}

/* BOTON REGRESAR HEADER */
.btn-back{
    width:45px;
    height:45px;
    margin:0;
    padding:0;
    border-radius:50%;
    background:
    linear-gradient(
    135deg,
    #0070f3,
    #00d4d4
    );
    color:white;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.3s;
}


.btn-back:hover{
    transform:scale(1.15);
    box-shadow:
    0 0 20px #00d4d4;
}

</style>
</head>
<body>

<div class="header">
<h1>
    <i class="fa-solid fa-diagram-project"></i>
    Project Management
    <span>
        New Project
    </span>
</h1>


<button class="btn-back" onclick="window.location.href='Projects.html'">
    <i class="fa-solid fa-arrow-left"></i>
</button>
</div>



<div class="container">
<div class="folio-box">
<i class="fa-solid fa-barcode"></i>
Folio:
<span id="folio">
Generando...
</span>
</div>

<br>


<div class="form-grid">
<div>
<label>StartDate</label>

<input
type="date"
id="DateStart"
readonly>
</div>


<div>
<label>Department</label>

<input
id="Department"
readonly>
</div>

<div>
<label>Project Name</label>

<input
id="ProjectName"
placeholder="Project Name">
</div>


<div>
<label>Type</label>
<select id="Type">
<option>Select</option>
<option>Improvement</option>
<option>Corrective</option>
<option>New Project</option>
</select>
</div>



<div style="grid-column:1/-1">
<label>Problem Description</label>

<textarea
id="ProblemDescription"
placeholder="Problem Description">
</textarea>
</div>


<div>
<label>Evidence Before</label>

<div class="upload">
<i class="fa-solid fa-image"></i>
<br><br>
<input 
type="file"
id="EvidenceBefore"
accept="image/*">
</div>
</div>


<div>
<label>Evidence After</label>


<div class="upload">
<i class="fa-solid fa-camera"></i>
<br><br>
<input 
type="file"
id="EvidenceAfter"
accept="image/*">
</div>
</div>


<div>
<label>EndDate</label>

<input 
type="date"
id="DateEnd">
</div>

<div>
<label>Priority</label>

<select id="Priority">
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>
</div>

<div><label>Status</label>
<select id="Status">
<option>New</option>
<option>Under Review</option>
<option>Approved</option>
<option>In Progress</option>
<option>On Hold</option>
<option>Cancelled</option>
<option>Completed</option>
<option>Closed</option>
</select>
</div>

<div>
<label>Lead</label>
<select id="Lead">
<option>Armando Osornio</option>
<option>Demetrio Moreno</option>
</select>
</div>


<div>
<label>Manager</label>
<input id="Manager">
</div>


<div>
<label>Approved</label>
<input id="Approved" placeholder="Yes / No">
</div>


<div>
<label>Progress %</label>
<input
type="text"
id="Progress"
placeholder="0%"
maxlength="4"
oninput="formatoPorcentaje(this)">
</div>


<div style="grid-column:1/-1">
<label>Remarks Comments</label>


<textarea 
id="RemarksComments">
</textarea>
</div>
</div>

<button onclick="guardarProyecto()">
<i class="fa-solid fa-floppy-disk"></i>
Submit Project
</button>


<div id="resultado">
Ready to enter information...
</div>
</div>


<script>

function formatoPorcentaje(input){
    let valor = input.value.replace(/\D/g,'');
     if(valor !== ""){
        valor = Math.min(parseInt(valor),100);
        input.value = valor + "%";
    }else{
        input.value = "";
    }
}
</script>

<script src="Projects.js"></script>

</body>
</html>
