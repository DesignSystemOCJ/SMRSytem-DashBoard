<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMRC System</title>

<link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:
    linear-gradient(
        rgba(2,6,23,0.85),
        rgba(2,6,23,0.95)
    ),
    url("https://primewheel.com/pwlogo.jpg");
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
    background-color:#020617;
    color:white;
    font-family:"Segoe UI", Arial, sans-serif;
}

.loaderBox{
    text-align:center;
    background:rgba(7,16,41,.75);
    padding:45px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:
    0 0 40px rgba(0,234,255,.25);
}

.loaderLogo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0A6ED1,#00d4c8);
    font-size:40px;
    animation:spin 3s infinite;
}

.loadingBar{
    width:280px;
    height:6px;
    margin-top:25px;
    background:#ffffff20;
    overflow:hidden;
    border-radius:10px;
}

.loadingBar div{
    width:40%;
    height:100%;
    background:linear-gradient(90deg,#0A6ED1,#00d4c8);
    animation:loading 1.5s infinite;
}

@keyframes loading{
from{transform:translateX(-150px);}
to{transform:translateX(300px);}
}

@keyframes spin{
50%{transform:rotateY(180deg);}
}

</style>
</head>

<body>

<div class="loaderBox">
<div class="loaderLogo">
<i class="fa-solid fa-cube"></i>
</div>

<h1>SMRC System</h1>
<p>Initializing Industrial Control Center...</p>
<div class="loadingBar">
<div></div>
</div>
</div>

<script>

setTimeout(()=>{
window.location.href="Menu.html";
},2500);

</script>
</body>
</html>
