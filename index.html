<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMRC System</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root {
  --bg-main: #eef2f6;          
  --card-bg: #ffffff;          
  --card-border: #e2e8f0;      
  --accent-blue: #0A6ED1;       
  --accent-cyan: #0284C7;      
  --text-main: #1e293b;      
  --text-muted: #64748b;        
  --track-bg: #cbd5e1;          
}

body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background:
    linear-gradient(
      rgba(238, 242, 246, 0.88),
      rgba(238, 242, 246, 0.95)
    ),
    url("https://controlaccesosysistemas.com/wp-content/uploads/2022/03/prime-wheel-980x980.png");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
}

.loaderBox {
  text-align: center;
  background: var(--card-bg);
  padding: 45px;
  border-radius: 20px;
  border: 1px solid var(--card-border);
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  max-width: 380px;
  width: 90%;
}

.loaderLogo {
  width: 80px;
  height: 80px;
  margin: 0 auto 20px auto;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  font-size: 38px;
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(10, 110, 209, 0.3);
  animation: spin 3s infinite ease-in-out;
}

.loaderBox h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 8px;
}

.loaderBox p {
  font-size: 14px;
  color: var(--text-muted);
  font-weight: 500;
  margin: 0;
}

.loadingBar {
  width: 100%;
  max-width: 280px;
  height: 6px;
  margin: 25px auto 0 auto;
  background: var(--track-bg);
  overflow: hidden;
  border-radius: 10px;
}

.loadingBar div {
  width: 45%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
  border-radius: 10px;
  animation: loading 1.5s infinite ease-in-out;
}

@keyframes loading {
  0% { transform: translateX(-150px); }
  100% { transform: translateX(300px); }
}

@keyframes spin {
  50% { transform: rotateY(180deg); }
}
</style>
</head>

<body>

<div class="loaderBox">
  <div class="loaderLogo">
    <i class="fa-solid fa-cube"></i>
  </div>

  <h1>SMRC System</h1>
  <p>Initializing Industrial Control Center...</p>
  
  <div class="loadingBar">
    <div></div>
  </div>
</div>

<script>
  setTimeout(() => {
    window.location.href = "Menu.html";
  }, 2000);
</script>

</body>
</html>
